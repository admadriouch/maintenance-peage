<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gare 331 - Maintenance Digitalisée</title>
    <style>
        /* Vos codes couleurs officiels */
        :root {
            --bleu-principal: #1C2F50;
            --bleu-fonce: #14294C;
            --blanc: #FFFFFF;
            --gris-clair: #AAB2BB;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
            background-color: var(--bleu-principal); 
            color: var(--blanc);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .container { 
            max-width: 450px; 
            width: 100%;
            background: var(--blanc); 
            border-radius: 20px; 
            padding: 35px 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            color: #333; 
            text-align: center;
        }
        
        .logo { 
            max-width: 160px; 
            height: auto; 
            margin-bottom: 20px;
        }
        
        h1 { 
            color: var(--bleu-principal); 
            font-size: 1.4rem; 
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle { 
            color: var(--gris-clair); 
            font-size: 0.9rem; 
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 30px;
            display: block;
        }
        
        /* Style des boutons */
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 100%; 
            padding: 16px 0; 
            margin: 15px 0;
            background-color: var(--bleu-principal); 
            color: var(--blanc); 
            text-decoration: none;
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover { 
            background-color: var(--bleu-fonce); 
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .btn-icon { 
            margin-right: 15px; 
            font-size: 1.3rem; 
        }

        /* Footer et Signature */
        .footer { 
            margin-top: 40px; 
            font-size: 0.85rem; 
            color: var(--gris-clair); 
            border-top: 1px solid #eee; 
            padding-top: 20px;
        }

        .creator { 
            font-weight: bold; 
            color: var(--bleu-principal);
            font-size: 0.95rem;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #28a745;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO -->
        <img src="logo_entreprise.png" alt="Logo Entreprise" class="logo">

        <div style="margin-bottom: 25px;">
            <div style="font-size: 0.7rem; color: #28a745; font-weight: bold; margin-bottom: 5px;">
                <span class="status-dot"></span> VOIE OPÉRATIONNEL
            </div>
            <h1>ARMOIRE ÉLECTRIQUE</h1>
            <span class="subtitle">PÉAGE MED V : GARE 331 - VOIE 01</span>
        </div>
        
        <!-- BOUTON VERS LA VISIONNEUSE INTERACTIVE -->
        <a href="visionneuse_schema.html" class="btn">
            <span class="btn-icon">📋</span> SCHÉMA ÉLECTRIQUE
        </a>
        
        <!-- AUTRES DOCUMENTS PDF -->
        <a href="details_equipements.pdf" target="_blank" class="btn">
            <span class="btn-icon">⚙️</span> DÉTAILS ÉQUIPEMENTS
        </a>
        
        <a href="securite_consignation.pdf" target="_blank" class="btn">
            <span class="btn-icon">🔐</span> SÉCURITÉ / CONSIGNATION
        </a>

        <!-- VOTRE SIGNATURE -->
        <div class="footer">
            <p>Ce domaine a été créé par :<br>
            <span class="creator">Mr Abdelali Adriouch</span></p>
            <p style="font-size: 0.7rem;">Maintenance Digitalisée © 2024</p>
        </div>
    </div>

</body>
</html>
